<div [class.dark-theme]="isDarkTheme">
  <app-header (menuClick)="sidenav.toggle()"></app-header>

<mat-sidenav-container>
  <mat-sidenav #sidenav mode="side" opened>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon>home</mat-icon>
        <span>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/counter" routerLinkActive="active">
        <mat-icon>calculate</mat-icon>
        <span>Counter</span>
      </a>
      <a mat-list-item routerLink="/design-system" routerLinkActive="active">
        <mat-icon>palette</mat-icon>
        <span>Design System</span>
      </a>
      <a mat-list-item routerLink="/tracker" routerLinkActive="active">
        <mat-icon>trending_up</mat-icon>
        <span>Dividend Tracker</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet></router-outlet>

    <!-- <div class="content-container">
    </div> -->
  </mat-sidenav-content>
</mat-sidenav-container>
</div>
