<app-header (toggleSidenav)="sidenav.toggle()"></app-header>
<mat-sidenav-container style="height: 100vh;">
  <mat-sidenav #sidenav mode="side" opened>
    <h2 style="margin: 1rem;">Menu</h2>
    <!-- Add navigation links here -->
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <span>{{ title }}</span>
    </mat-toolbar>
    <div style="padding: 2rem;">
      <h2>NgRx Signals Counter Demo</h2>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <button mat-raised-button color="primary" (click)="decrement()">-</button>
        <span style="font-size: 2rem;">{{ counter() }}</span>
        <button mat-raised-button color="primary" (click)="increment()">+</button>
        <button mat-button color="accent" (click)="reset()">Reset</button>
      </div>
    </div>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
