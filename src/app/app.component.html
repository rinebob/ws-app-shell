<app-header (toggleSidenav)="sidenav.toggle()"></app-header>

<mat-sidenav-container>
  <mat-sidenav #sidenav mode="side" opened>
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <span class="material-icons">home</span>
        Home
      </a>
      <a mat-list-item routerLink="/counter" routerLinkActive="active">
        <span class="material-icons">calculate</span>
        Counter
      </a>
      <a mat-list-item routerLink="/design-system" routerLinkActive="active">
        <span class="material-icons">palette</span>
        Design System
      </a>
      <a mat-list-item routerLink="/tracker" routerLinkActive="active">
        <span class="material-icons">trending_up</span>
        Dividend Tracker
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>

    <div class="content-container">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
